name: chinese_cribbage
description: "Chinese Cribbage for Android and iOS — a Flutter port of the web game."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  firebase_database: ^13.0.1
  firebase_auth: ^7.0.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/backs/
    - assets/tiles/
    - assets/bg/
    - assets/faces/imperial/
    - assets/faces/dragonbrush/
    - assets/faces/jadeporc/

# App icon + launch screen. Regenerate after replacing the images in assets/icon/:
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#2B1714"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#2B1714"
  image: assets/icon/splash.png
  android_12:
    color: "#2B1714"
    image: assets/icon/splash.png
